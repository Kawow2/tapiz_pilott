services:
  db:
    image: postgres:16
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT_HOST}:5432'

  api:
    restart: always
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.api
    depends_on:
      - db
    ports:
      - '${API_PORT}:${API_PORT}'
    environment:
      - NODE_ENV=production
      - API_HOST=${API_HOST}
      - API_PORT=${API_PORT}
      - API_URL=${API_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT_HOST=${POSTGRES_PORT_HOST}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - AI_AGENT_LOGIN_ENABLED=${AI_AGENT_LOGIN_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_SECURE=${SMTP_SECURE:-false}
    volumes:
      - ./uploads:/home/tapiz/uploads

  web:
    restart: always
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        - API_URL=${API_URL}
        - WS_URL=${WS_URL}
    depends_on:
      - api
    ports:
      - '${FRONTEND_PORT}:80'

volumes:
  pgdata:
