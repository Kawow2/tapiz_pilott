services:
  db:
    image: postgres:16
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tapiz}
      POSTGRES_USER: ${POSTGRES_USER:-tapiz_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tapiz_password}
    ports:
      - '${POSTGRES_PORT_HOST:-5432}:5432'

  api:
    restart: always
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.api
    depends_on:
      - db
    # The API is not published on the host: the browser reaches it through the
    # web container's nginx (same-origin on FRONTEND_PORT), which proxies /api
    # and /socket.io to api:8000 over the internal Docker network. This avoids
    # host port conflicts and keeps the API unexposed.
    environment:
      - NODE_ENV=production
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
      - API_URL=${API_URL:-http://localhost:4300/api}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:4300}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT_HOST=${POSTGRES_PORT_HOST:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-tapiz_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tapiz_password}
      - POSTGRES_DB=${POSTGRES_DB:-tapiz}
      - AI_AGENT_LOGIN_ENABLED=${AI_AGENT_LOGIN_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_SECURE=${SMTP_SECURE:-false}
    volumes:
      - ./uploads:/home/tapiz/uploads

  web:
    restart: always
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        # The web bundle is served same-origin behind this nginx, which proxies
        # /api and /socket.io to the API. Keep these RELATIVE (not the server's
        # absolute API_URL) so the SAME image talks to whatever host serves it:
        # localhost when you run it locally, the LAN IP in prod. Baking an
        # absolute host here is what makes a local container call prod instead.
        # Only set WEB_API_URL/WEB_WS_URL if the frontend is served from a
        # different origin than the API.
        - API_URL=${WEB_API_URL:-/api}
        - WS_URL=${WEB_WS_URL:-}
    depends_on:
      - api
    ports:
      - '${FRONTEND_PORT:-4300}:80'

volumes:
  pgdata:

networks:
  # Cap the Docker network MTU so containers send packets that fit reduced-MTU
  # paths (VPN/WiFi). Without this, large WebSocket frames (board state) can be
  # silently dropped on such paths while small requests still work. 900 covers
  # heavily constrained VPNs seen in practice; tune it via DOCKER_MTU (a higher
  # value like 1400 is slightly more efficient if your clients allow it).
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: '${DOCKER_MTU:-900}'
