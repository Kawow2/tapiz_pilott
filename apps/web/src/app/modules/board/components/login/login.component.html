<div class="col">
  <div class="logo">
    <img
      priority="true"
      ngSrc="/assets/svgs/tapiz-logo.svg"
      width="140"
      height="65"
      alt="Tapiz logo" />
    <img
      priority="true"
      class="login-img"
      ngSrc="/assets/login-img.png"
      width="300"
      height="320"
      alt="Welcome to Tapiz" />
  </div>
  <p class="claim">
    Welcome to Tapiz! The free Open Source Tool designed for effortless and
    productive meetings, retrospectives, and brainstorming.
  </p>

  <form
    class="login-form"
    (ngSubmit)="login()">
    <label
      class="field-label"
      for="pseudo"
      >Choose a nickname to get started</label
    >
    <input
      id="pseudo"
      class="pseudo-input"
      type="text"
      autocomplete="off"
      maxlength="50"
      placeholder="Your nickname"
      [formControl]="name" />

    <button
      class="submit"
      type="submit"
      [disabled]="loading()">
      Continue
    </button>
  </form>
</div>
