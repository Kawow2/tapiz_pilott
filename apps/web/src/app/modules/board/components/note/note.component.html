<tapiz-node-space
  [node]="node()"
  [resize]="true"
  [rotate]="false"
  [showOutline]="focus()"
  [enabled]="!edit()"
  [cursor]="cursor()"
  (dropped)="onDrop()"
  (dragging)="onDrag()">
  <div class="inner">
    <div class="top-info">
      @if (comments()) {
        <button
          type="button"
          class="comments"
          (click)="openComments()">
          {{ comments() }}

          <mat-icon>comments</mat-icon>
        </button>
      }

      @if (votes() > 0) {
        <div class="vote">
          {{ votes() }}
        </div>
      }
    </div>
    @if (edit()) {
      <tapiz-editor-portal [node]="node()">
        <tapiz-editor-view
          [class.readonly]="!edit()"
          [defaultTextColor]="defaultTextColor()"
          [defaultFontFamily]="defaultFontFamily()"
          [defaultBold]="defaultBold()"
          [defaultItalic]="defaultItalic()"
          #editorView="editorView"
          [content]="initialText()"
          [focus]="edit()"
          [mentions]="mentions()"
          customClass="note-rich-text"
          (mentioned)="onMention($event)"
          (contentChange)="setText($event)" />
      </tapiz-editor-portal>

      @if (editorView.editor(); as editor) {
        <tapiz-portal name="node-toolbar">
          <tapiz-node-toolbar
            [node]="node()"
            [editor]="editor" />
        </tapiz-portal>
      }
    } @else {
      <div
        class="rich-text"
        [innerHTML]="node().content.text | safeHtml"></div>
    }

    @if (showNoteAuthor()) {
      <div
        class="name"
        [title]="username()">
        {{ username() }}
      </div>
    }
    @for (emoji of node().content.emojis; track emoji) {
      <div
        class="emoji"
        [style.left.px]="emoji.position.x"
        [style.top.px]="emoji.position.y">
        {{ emoji.unicode }}
      </div>
    }
    @if (visible()) {
      <canvas
        [tapizDrawing]="node().content.drawing"
        (drawing)="setDrawing($event)"
        [width]="node().content.width"
        [height]="node().content.height"></canvas>
    }
  </div>
</tapiz-node-space>

@if (showQuickAdd()) {
  <button
    type="button"
    class="quick-add right"
    title="Add note to the right"
    (mousedown)="$event.stopPropagation()"
    (click)="addAdjacentNote('right')">
    +
  </button>
  <button
    type="button"
    class="quick-add left"
    title="Add note to the left"
    (mousedown)="$event.stopPropagation()"
    (click)="addAdjacentNote('left')">
    +
  </button>
  <button
    type="button"
    class="quick-add bottom"
    title="Add note below"
    (mousedown)="$event.stopPropagation()"
    (click)="addAdjacentNote('bottom')">
    +
  </button>

  <tapiz-portal name="node-toolbar">
    <tapiz-note-color-toolbar [node]="node()" />
  </tapiz-portal>
}
