<div class="list">
  <button
    type="button"
    class="list-item"
    (click)="selectedNote()">
    <div class="list-name">
      <mat-icon
        class="icon"
        svgIcon="add"></mat-icon>
      <span>Note</span>
    </div>
    <span class="key">Double Click</span>
  </button>
  <button
    type="button"
    class="list-item"
    (click)="selectedPanel()">
    <div class="list-name">
      <mat-icon
        class="icon"
        svgIcon="panel"></mat-icon>
      <span>Panel</span>
    </div>
    <span class="key">P</span>
  </button>
  <button
    type="button"
    class="list-item"
    (click)="selectedText()">
    <div class="list-name">
      <mat-icon
        class="icon"
        svgIcon="text"></mat-icon>
      <span>Text</span>
    </div>
    <span class="key">T</span>
  </button>
  <button
    type="button"
    class="list-item"
    (click)="selectedImage()">
    <div class="list-name">
      <mat-icon
        class="icon"
        svgIcon="image"></mat-icon>
      <span>Image</span>
    </div>
    <span class="key">I</span>
  </button>
  <button
    type="button"
    class="list-item"
    (click)="selectedPoll()">
    <div class="list-name">
      <mat-icon
        class="icon"
        svgIcon="poll"></mat-icon>
      <span>Poll</span>
    </div>
  </button>
  <button
    type="button"
    class="list-item"
    (click)="selectedEstimation()">
    <div class="list-name">
      <mat-icon
        class="icon"
        svgIcon="estimation"></mat-icon>
      <span>Estimation</span>
    </div>
  </button>
  <button
    type="button"
    class="list-item"
    (click)="selectedTimer()">
    <div class="list-name">
      <mat-icon
        class="icon"
        svgIcon="clock"></mat-icon>
      <span>Timer</span>
    </div>
  </button>
  <button
    type="button"
    class="list-item"
    (click)="selectedArrow()">
    <div class="list-name">
      <lucide-icon
        class="icon"
        name="move-right"></lucide-icon>
      <span>Arrow</span>
    </div>
  </button>
  <button
    type="button"
    class="list-item"
    (click)="selectedRectangle()">
    <div class="list-name">
      <svg
        class="icon"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg">
        <rect
          x="4"
          y="6"
          width="16"
          height="12"
          rx="1"
          stroke="currentColor"
          stroke-width="2" />
      </svg>
      <span>Rectangle</span>
    </div>
  </button>
  <button
    type="button"
    class="list-item"
    (click)="selectedCircle()">
    <div class="list-name">
      <svg
        class="icon"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg">
        <circle
          cx="12"
          cy="12"
          r="8"
          stroke="currentColor"
          stroke-width="2" />
      </svg>
      <span>Circle</span>
    </div>
  </button>
  <button
    type="button"
    class="list-item"
    (click)="selectedTriangle()">
    <div class="list-name">
      <svg
        class="icon"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg">
        <polygon
          points="12,4 20,19 4,19"
          stroke="currentColor"
          stroke-width="2"
          stroke-linejoin="round" />
      </svg>
      <span>Triangle</span>
    </div>
  </button>
  <button
    type="button"
    class="list-item"
    (click)="selectedLine()">
    <div class="list-name">
      <svg
        class="icon"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg">
        <line
          x1="4"
          y1="19"
          x2="20"
          y2="5"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round" />
      </svg>
      <span>Line</span>
    </div>
  </button>
</div>
